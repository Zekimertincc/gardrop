<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4">
<title>Outfit</title>
<style>
  :root { --bg:#f5f5f4; --card:#fff; --ink:#1c1917; --mute:#78716c; --line:#e7e5e4; --accent:#1c1917; --err:#dc2626; --stage:#e9e7e4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1f1f1d; --ink:#f5f5f4; --mute:#a8a29e; --line:#2e2e2b; --accent:#f5f5f4; --err:#f87171; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0 auto; max-width:520px; height:100dvh; display:flex; flex-direction:column; gap:8px; color:var(--ink); font:16px system-ui,sans-serif;
         padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  button { font:inherit; color:var(--ink); cursor:pointer; }

  header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  h1 { font-size:18px; margin:0; }
  .actions { display:flex; gap:6px; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px 12px; font-size:14px; }

  #login { display:flex; gap:8px; }
  #login[hidden] { display:none; }
  #login input { flex:1; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:16px; }
  #login button { border:0; background:var(--accent); color:var(--bg); border-radius:10px; padding:0 16px; }
  #msg { font-size:13px; color:var(--mute); text-align:center; }
  #msg:empty { display:none; }
  #msg.err { color:var(--err); }

  /* sahne: parçalar üst üste katman olarak durur */
  #stage { flex:1; min-height:0; position:relative; overflow:hidden; background:var(--stage); border:1px solid var(--line); border-radius:16px; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .layer { position:absolute; object-fit:contain; pointer-events:none; -webkit-user-drag:none; }
  #stageMsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:#78716c; font-size:14px; pointer-events:none; }

  #tabs { display:flex; gap:4px; align-items:center; }
  .tab { flex:1; min-width:0; padding:9px 0; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:12px; white-space:nowrap; }
  .tab.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  #del { color:var(--err); padding:8px 10px; font-size:13px; }
  #del[hidden] { display:none; }

  #strip { display:flex; gap:8px; overflow-x:auto; padding:2px 1px; scrollbar-width:none; }
  #strip::-webkit-scrollbar { display:none; }
  .tile { flex:0 0 68px; height:68px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:3px; }
  .tile img { width:100%; height:100%; object-fit:contain; }
  .tile.sel { border:2px solid var(--accent); padding:2px; }
  .tile.none, .tile.add { border-style:dashed; color:var(--mute); font-size:13px; }
  .tile.add { font-size:26px; }

  .hint { color:var(--mute); font-size:12px; text-align:center; }
  @media (hover:none) { .hint .kb { display:none; } }
  @media (hover:hover) { .hint .touch { display:none; } }

  /* kayıtlı kombinler */
  #sheet { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  #sheet[hidden] { display:none; }
  .panel { width:100%; max-width:520px; max-height:85dvh; overflow:auto; background:var(--bg); border-radius:16px 16px 0 0; padding:12px 12px max(12px, env(safe-area-inset-bottom)); }
  .phead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .mini { position:relative; aspect-ratio:5/7; background:var(--stage); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; }
  .xdel { position:absolute; top:4px; right:4px; z-index:10; border:0; background:rgba(255,255,255,.85); color:#dc2626; border-radius:8px; padding:6px 10px; font-size:12px; }
  .nothing { color:var(--mute); text-align:center; font-size:14px; padding:24px 0; }
</style>
</head>
<body>
<header>
  <h1>Outfit</h1>
  <div class="actions">
    <button class="btn" id="save">💾 Kaydet</button>
    <button class="btn" id="showOutfits" aria-label="Kayıtlı kombinler">📁 <span id="outfitCount">0</span></button>
    <button class="btn" id="shuffle" aria-label="Rastgele kombin">🎲</button>
  </div>
</header>
<form id="login" hidden>
  <input type="password" id="pw" placeholder="Şifre" autocomplete="current-password">
  <button>Giriş</button>
</form>
<div id="msg"></div>

<div id="stage"><div id="stageMsg"></div></div>
<div id="tabs"></div>
<div id="strip"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="hint">
  <span class="kb">← → kıyafet değiştir · ↑ ↓ kategori</span>
  <span class="touch">Sahnede sağa / sola kaydır, ya da alttan seç</span>
</div>

<div id="sheet" hidden>
  <div class="panel">
    <div class="phead"><b>Kayıtlı kombinler</b><button class="btn" id="closeSheet">Kapat</button></div>
    <div id="outfitList"></div>
  </div>
</div>

<script>
// box: katmanın sahnedeki yeri (% olarak), z: üst üste sırası, pos: kutu içinde hizalama
// optional: listede "hiçbiri" konumu da olur (index -1)
const CATS = [
  { id: 'tshirt', name: 'T-shirt',  z: 3, pos: 'center top',    box: { l: 20, t: 14, w: 60, h: 36 } },
  { id: 'sweat',  name: 'Kazak',    z: 4, pos: 'center top',    box: { l: 15, t: 12, w: 70, h: 41 }, optional: true }, // hoodie, sweatshirt, hırka
  { id: 'jacket', name: 'Ceket',    z: 5, pos: 'center top',    box: { l: 10, t: 10, w: 80, h: 46 }, optional: true },
  { id: 'pants',  name: 'Pantolon', z: 2, pos: 'center top',    box: { l: 22, t: 44, w: 56, h: 40 } },
  { id: 'shoes',  name: 'Ayakkabı', z: 1, pos: 'center top',    box: { l: 20, t: 80, w: 60, h: 16 } },
];
const layerStyle = c => `left:${c.box.l}%;top:${c.box.t}%;width:${c.box.w}%;height:${c.box.h}%;z-index:${c.z};object-position:${c.pos}`;

const $ = id => document.getElementById(id);
const msg = $('msg'), loginForm = $('login'), sheet = $('sheet'), stage = $('stage'), strip = $('strip'), tabs = $('tabs');
const showMsg = (text = '', isError = false) => { msg.textContent = text; msg.className = isError ? 'err' : ''; };
const minIndex = c => c.optional ? -1 : 0;

// --- api ---
const getPw = () => (localStorage.getItem('pw') || '').trim();

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { 'x-password': getPw(), ...opts.headers } });
  if (r.status === 401) {
    loginForm.hidden = false;
    throw new Error(getPw() ? 'Şifre yanlış' : 'Şifre gerekli');
  }
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    throw new Error(body.error || 'Sunucu hatası (' + r.status + ')');
  }
  return r.json();
}

// hata olursa ekranda göster, sessiz kalma
const safe = fn => async (...args) => {
  try { showMsg(); await fn(...args); } catch (e) { showMsg(e.message, true); }
};

// Foto küçülür. Şeffaf PNG ise şeffaflık korunur ve boş kenarlar kırpılır (PNG olarak yüklenir),
// düz foto ise JPEG olarak yüklenir. Vercel body limiti 4.5MB, o yüzden büyükse küçültüp tekrar dener.
async function shrink(file, max = 1000) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { throw new Error('Foto okunamadı. PNG veya JPG dene.'); }
  const toBlob = (canvas, type, q) => new Promise(ok => canvas.toBlob(ok, type, q));
  let scale = Math.min(1, max / Math.max(bmp.width, bmp.height));

  for (;;) {
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(bmp, 0, 0, w, h);

    const px = g.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1, transparent = false;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const a = px[(y * w + x) * 4 + 3];
        if (a < 250) transparent = true;
        if (a > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
    }
    if (x1 < 0) throw new Error('Foto tamamen şeffaf');

    let blob;
    if (!transparent) {
      blob = await toBlob(c, 'image/jpeg', 0.85);
    } else {
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
      const out = document.createElement('canvas');
      out.width = cw; out.height = ch;
      out.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
      blob = await toBlob(out, 'image/png');
    }
    if (blob.size < 4e6 || scale < 0.3) { bmp.close(); return blob; }
    scale *= 0.75;
  }
}

// --- state ---
const items = Object.fromEntries(CATS.map(c => [c.id, []])); // [{id, url}]
const index = Object.fromEntries(CATS.map(c => [c.id, 0]));
let outfits = []; // [{url, parts: {tshirt: id, jacket: id|null, ...}}]
let active = 0;   // seçili kategori (sekme)
let loaded = false;

const load = safe(async () => {
  try {
    const data = await api('/api/items');
    CATS.forEach(c => { items[c.id] = []; });
    for (const it of data.items) { items[it.cat]?.push({ id: it.id, url: it.url }); new Image().src = it.url; } // önbelleğe al, geçişler anlık olsun
    outfits = data.outfits;
  } finally {
    loaded = true;
    render();
    renderOutfits();
  }
});

const addFiles = safe(async (cat, files) => {
  const images = [...files].filter(f => f.type.startsWith('image/'));
  for (const [n, f] of images.entries()) {
    showMsg(`Yükleniyor ${n + 1}/${images.length}…`);
    const blob = await shrink(f);
    const it = await api('/api/items?cat=' + cat, { method: 'POST', body: blob });
    items[cat].push({ id: it.id, url: it.url });
    index[cat] = items[cat].length - 1;
    render();
  }
  showMsg();
});

const remove = safe(async cat => {
  const it = items[cat][index[cat]];
  if (!it || !confirm('Bu kıyafet silinsin mi? (İçeren kayıtlı kombinler de silinir)')) return;
  await api('/api/items?url=' + encodeURIComponent(it.url), { method: 'DELETE' });
  items[cat].splice(index[cat], 1);
  index[cat] = Math.max(0, index[cat] - 1);
  outfits = outfits.filter(o => !Object.values(o.parts).includes(it.id));
  render();
  renderOutfits();
});

function step(catId, d) {
  const lo = minIndex(CATS.find(c => c.id === catId));
  const span = items[catId].length - lo; // seçilebilir konum sayısı
  if (items[catId].length) index[catId] = lo + (((index[catId] - lo + d) % span) + span) % span;
  render();
}

// --- kayıtlı kombinler ---
const saveOutfit = safe(async () => {
  const parts = {};
  for (const c of CATS) {
    const it = items[c.id][index[c.id]];
    if (!it && !c.optional) throw new Error(`${c.name} seçili değil`);
    parts[c.id] = it ? it.id : null;
  }
  const key = o => CATS.map(c => o[c.id]).join();
  if (outfits.some(o => key(o.parts) === key(parts))) throw new Error('Bu kombin zaten kayıtlı');
  const saved = await api('/api/outfits', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(parts) });
  outfits.unshift({ url: saved.url, parts });
  renderOutfits();
  const text = 'Kombin kaydedildi ✓';
  showMsg(text);
  setTimeout(() => { if (msg.textContent === text) showMsg(); }, 2000);
});

function applyOutfit(o) {
  for (const c of CATS) {
    const id = o.parts[c.id] ?? null; // eski kayıtlarda kazak alanı yok
    if (id === null) { index[c.id] = -1; continue; }
    const i = items[c.id].findIndex(it => it.id === id);
    if (i >= 0) index[c.id] = i;
  }
  render();
  sheet.hidden = true;
}

const removeOutfit = safe(async o => {
  if (!confirm('Bu kombin silinsin mi?')) return;
  await api('/api/outfits?url=' + encodeURIComponent(o.url), { method: 'DELETE' });
  outfits = outfits.filter(x => x !== o);
  renderOutfits();
});

function renderOutfits() {
  $('outfitCount').textContent = outfits.length;
  const list = $('outfitList');
  if (!outfits.length) { list.innerHTML = '<div class="nothing">Henüz kayıtlı kombin yok. Beğendiğin kombini 💾 Kaydet ile ekle.</div>'; return; }
  // her kombin, sahnenin küçük hali
  list.innerHTML = `<div class="grid">${outfits.map((o, i) => `
    <div class="mini" data-i="${i}">
      ${CATS.map(c => {
        const it = items[c.id].find(x => x.id === o.parts[c.id]);
        return it ? `<img class="layer" style="${layerStyle(c)}" src="${it.url}" alt="${c.name}">` : '';
      }).join('')}
      <button class="xdel" data-del="${i}">Sil</button>
    </div>`).join('')}</div>`;
}

$('outfitList').onclick = e => {
  const del = e.target.closest('[data-del]');
  if (del) return removeOutfit(outfits[+del.dataset.del]);
  const mini = e.target.closest('.mini');
  if (mini) applyOutfit(outfits[+mini.dataset.i]);
};
$('showOutfits').onclick = () => { sheet.hidden = false; };
$('closeSheet').onclick = () => { sheet.hidden = true; };
sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
$('save').onclick = saveOutfit;

// --- sahne: parçalar tek bir figür gibi üst üste durur ---
const layers = {};
CATS.forEach(c => {
  const img = document.createElement('img');
  img.className = 'layer';
  img.style.cssText = layerStyle(c);
  img.alt = c.name;
  img.draggable = false;
  img.hidden = true;
  stage.appendChild(img);
  layers[c.id] = img;
});

function renderStage() {
  CATS.forEach(c => {
    const it = items[c.id][index[c.id]], img = layers[c.id];
    img.hidden = !it;
    if (it && img.getAttribute('src') !== it.url) img.src = it.url;
  });
  const empty = CATS.every(c => !items[c.id].length);
  $('stageMsg').textContent = !loaded ? 'Yükleniyor…' : empty ? 'Başlamak için alttaki + ile ilk fotoğrafını ekle' : '';
}

// --- alt kısım: kategori sekmeleri + küçük resim şeridi ---
tabs.innerHTML = CATS.map((c, i) => `<button class="tab" data-i="${i}">${c.name}</button>`).join('')
  + '<button class="btn" id="del">Sil</button>';

function renderTabs() {
  tabs.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('on', i === active));
  const c = CATS[active];
  $('del').hidden = !items[c.id][index[c.id]];
}

function renderStrip() {
  const c = CATS[active], list = items[c.id];
  const tiles = [];
  if (c.optional) tiles.push(`<button class="tile none${index[c.id] === -1 ? ' sel' : ''}" data-i="-1">Yok</button>`);
  list.forEach((it, i) => tiles.push(`<button class="tile${i === index[c.id] ? ' sel' : ''}" data-i="${i}"><img src="${it.url}" alt="" draggable="false"></button>`));
  tiles.push('<button class="tile add" data-add="1" aria-label="Foto ekle">+</button>');
  strip.innerHTML = tiles.join('');
  strip.querySelector('.sel')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function render() { renderStage(); renderTabs(); renderStrip(); }

tabs.onclick = e => {
  const tab = e.target.closest('.tab');
  if (tab) { active = +tab.dataset.i; render(); }
  else if (e.target.closest('#del')) remove(CATS[active].id);
};

strip.onclick = e => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  if (tile.dataset.add) return $('file').click();
  index[CATS[active].id] = +tile.dataset.i;
  render();
};

$('file').onchange = e => {
  const input = e.target;
  addFiles(CATS[active].id, input.files).finally(() => { input.value = ''; });
};

// sahnede kaydırarak seçili kategorinin kıyafetini değiştir
let x0 = null;
stage.addEventListener('pointerdown', e => { x0 = e.clientX; });
stage.addEventListener('pointercancel', () => { x0 = null; });
stage.addEventListener('pointerup', e => {
  if (x0 === null) return;
  const dx = e.clientX - x0;
  x0 = null;
  if (Math.abs(dx) > 40) step(CATS[active].id, dx < 0 ? 1 : -1);
});

// masaüstünde sürükle-bırak: seçili kategoriye eklenir
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); addFiles(CATS[active].id, e.dataTransfer.files); });

$('shuffle').onclick = () => {
  CATS.forEach(c => {
    const n = items[c.id].length, lo = minIndex(c);
    if (n) index[c.id] = lo + Math.floor(Math.random() * (n - lo));
  });
  render();
};

document.addEventListener('keydown', e => {
  if (!sheet.hidden) { if (e.key === 'Escape') sheet.hidden = true; return; }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') step(CATS[active].id, -1);
  else if (e.key === 'ArrowRight') step(CATS[active].id, 1);
  else if (e.key === 'ArrowUp') { active = (active + CATS.length - 1) % CATS.length; render(); }
  else if (e.key === 'ArrowDown') { active = (active + 1) % CATS.length; render(); }
  else return;
  e.preventDefault();
});

loginForm.onsubmit = e => {
  e.preventDefault();
  localStorage.setItem('pw', $('pw').value.trim());
  loginForm.hidden = true;
  load();
};

render();
renderOutfits();
load();
</script>
</body>
</html>
